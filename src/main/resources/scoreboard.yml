# ==========================================================
# 计分板（display 包）
# ----------------------------------------------------------
# 屏幕右侧的竖直信息栏。
#
# 内容写法与 tab.yml 相同：MiniMessage + 内置占位符 + PlaceholderAPI 占位符
#   内置：{player} {world} {x} {y} {z} {online} {max} {tps} {mspt}
#
# 注意：
#   · 右侧最多显示 15 行，超出的行会被忽略
#   · 空字符串 "" 表示一个空行（用于分组留白）
#   · 本插件会给每位玩家一个独立计分板；若服务器上其他插件也占用右侧计分板，
#     两者会互相覆盖，建议只保留一个（把本插件的 enabled 关掉即可）
# ==========================================================

# 总开关
enabled: true

# 刷新间隔（tick，20 = 每秒）
refresh-ticks: 20

# 标题
title: "<gradient:#00d2ff:#3a7bd5><b>星落平原</b></gradient> <dark_gray>·</dark_gray> <white>原版服</white>"

# 行（自上而下，最多 15 行）
lines:
  - "<dark_gray>-------------------------"
  - "<gray>玩家 <dark_gray>»</dark_gray> <white>{player}</white>"
  - "<gray>世界 <dark_gray>»</dark_gray> <aqua>{world}</aqua>"
  - "<gray>坐标 <dark_gray>»</dark_gray> <yellow>{x}</yellow><dark_gray>,</dark_gray> <yellow>{y}</yellow><dark_gray>,</dark_gray> <yellow>{z}</yellow>"
  - "<gray>在线 <dark_gray>»</dark_gray> <green>{online}</green><dark_gray>/</dark_gray><gray>{max}</gray>"
  - ""
  - "<dark_gray>-------------------------"
  - ""
  - "<gradient:#00d2ff:#3a7bd5>» 祝你游玩愉快 «</gradient>"
