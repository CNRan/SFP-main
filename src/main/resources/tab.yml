# ==========================================================
# Tab 列表（display 包）
# ----------------------------------------------------------
# 按 Tab 键弹出的玩家列表的「头部 / 底部」文字，都支持多行。
#
# 内容写法：
#   · MiniMessage 格式，如 <gray> <white> <gradient:...>
#   · 内置占位符：{player} {world} {x} {y} {z} {online} {max} {tps} {mspt}
#     （{tps} / {mspt} 是插件算出来的**当前值**，直接可用）
#   · PlaceholderAPI 占位符：%xxx%
#     例如 spark 的 %spark_tps% / %spark_tickduration%
#     （注意 spark 会一次返回多个时间窗口的值，想要单值就用上面的 {tps} / {mspt}）
#
# 缺少的占位符会原样显示（说明对应的 PAPI 扩展没装）。
# ==========================================================

# 总开关：false 则完全不接管 Tab 列表（保持原版样式）
enabled: true

# 刷新间隔（tick，20 = 每秒）
refresh-ticks: 20

# 头部（自上而下多行）
header:
  - "<rainbow>星落平原-原版服</rainbow>"
  - "<gray>在线 <white>{online}</white> <dark_gray>/</dark_gray> <white>{max}</white></gray>"

# 底部（自上而下多行）—— 只显示当前的 TPS / MSPT
footer:
  - "<gray>TPS  <green>{tps}</green></gray>"
  - "<gray>MSPT <green>{mspt}</green></gray>"
