# ==========================================================
# 垃圾桶（trashbin 包）
# 文案在 messages.yml 的 trashbin.* 中修改
# ==========================================================

# 总开关：false 则关闭垃圾桶界面与命令，扫地物将按 clean.yml 的 to-trashbin 处理
enabled: true

# 每页物品格数（上限 45；54 格箱子中其余格用于翻页与信息）
page-size: 45

# 最大保留物品数，超出后自动丢弃最旧的
max-items: 486

# 取回物品后是否立即写盘（关闭则仅退出/清扫时保存，性能更好但可能丢数据）
save-immediately: true

# 音效（Bukkit Sound 名称，留空则静音）
sounds:
  open: ""
  take: "ENTITY_ITEM_PICKUP"
