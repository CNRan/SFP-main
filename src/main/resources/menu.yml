# ==========================================================
# 主菜单（menu 包）
# ----------------------------------------------------------
# 菜单标题、尺寸、边框与每个按钮都在此定义。
# 按钮通用字段：
#   enabled   是否显示该按钮
#   slot      槽位（0 ~ rows*9-1，行优先：slot = 行*9 + 列）
#   material  Bukkit 材质名（Material）
#   name      显示名（MiniMessage）
#   lore      描述（列表，可省略）
#   command   点击执行的命令，不含斜杠
#             （留空 = 由插件内部处理，如垃圾桶 / 家 / 传送点 / 返回按钮）
#
# 槽位分布（5 行 × 9 列，第 0/4 行与第 0/8 列为边框）：
#       列0  列1  列2  列3  列4  列5  列6  列7  列8
#   行0  ▓    ▓    ▓    ▓   头   ▓    ▓    ▓    ▓
#   行1  ▓    .   返   .   家   .   点   .   桶   ▓
#   行2  ▓    .   领   .   扫   .   坐   .    .   ▓
#   行3  ▓    .    .    .    .    .    .    .    ▓
#   行4  ▓    ▓    ▓    ▓    ▓    ▓    ▓    ▓    ▓
# ==========================================================

# 总开关：false 则停用整个菜单（/menu 与 /m 提示未启用）
enabled: true

# 菜单标题（MiniMessage）
title: "<rainbow><b><i>星落平原 菜单</i></b></rainbow>"

# 菜单行数（1 ~ 6，每行 9 格）。当前布局按 5 行排布
rows: 5

# 边框玻璃
border:
  fill: true
  # 按顺序循环填充边框，可放多种颜色玻璃做彩虹边
  materials:
    - RED_STAINED_GLASS_PANE
    - ORANGE_STAINED_GLASS_PANE
    - YELLOW_STAINED_GLASS_PANE
    - LIME_STAINED_GLASS_PANE
    - GREEN_STAINED_GLASS_PANE
    - CYAN_STAINED_GLASS_PANE
    - LIGHT_BLUE_STAINED_GLASS_PANE
    - BLUE_STAINED_GLASS_PANE
    - PURPLE_STAINED_GLASS_PANE
    - MAGENTA_STAINED_GLASS_PANE
    - PINK_STAINED_GLASS_PANE
    - WHITE_STAINED_GLASS_PANE
    - LIGHT_GRAY_STAINED_GLASS_PANE
    - GRAY_STAINED_GLASS_PANE
    - BROWN_STAINED_GLASS_PANE
    - BLACK_STAINED_GLASS_PANE

# 顶栏玩家头颅
player-head:
  enabled: true
  slot: 4

# 与功能模块的绑定（一般无需修改）
bind:
  trashbin-button: "trashbin"
  home-button: "home"
  warp-button: "warp"
  back-button: "back"

# 权限
permission: "sfpmenu.player"
permission-message: "你没有权限使用此命令"

# ---------------- 按钮 ----------------
buttons:

  # 返回上一位置（内部动作，等效 /back）
  back:
    enabled: true
    slot: 19
    material: ENDER_PEARL
    name: "<light_purple>返回上一位置</light_purple>"
    lore:
      - "<gray>回到上次传送前或死亡的位置</gray>"
    command: ""

  # 个人家（内部动作，打开家列表）
  home:
    enabled: true
    slot: 21
    material: RED_BED
    name: "<red>我的家</red>"
    lore:
      - "<gray>查看并传送到已设置的家</gray>"
      - "<gray>左键传送 / 右键删除</gray>"
    command: ""

  # 公共传送点（内部动作，打开传送点列表）
  warp:
    enabled: true
    slot: 23
    material: ENDER_EYE
    name: "<light_purple>传送点</light_purple>"
    lore:
      - "<gray>查看并传送到服务器传送点</gray>"
      - "<gray>左键传送 / 右键删除</gray>"
    command: ""

  # 垃圾桶（受 trashbin.yml 总开关控制）
  trashbin:
    enabled: true
    slot: 25
    material: CAULDRON
    name: "<dark_gray>垃圾桶</dark_gray> <gray>(取回扫地物品)</gray>"
    lore:
      - "<gray>点击取回被清扫的物品</gray>"
    command: ""

  # 领地菜单（执行 Dominion 领地插件命令 /dom）
  dominion:
    enabled: true
    slot: 29
    material: GRASS_BLOCK
    name: "<green>领地菜单</green>"
    lore:
      - "<gray>管理你的领地</gray>"
    command: "dom"

  # 自动扫地（点击直接打开垃圾桶界面，取回被清扫的物品）
  clean:
    enabled: true
    slot: 31
    material: BLAZE_ROD
    name: "<yellow>自动扫地</yellow>"
    lore:
      - "<gray>服务器定期清扫地面掉落物</gray>"
      - "<gray>被清扫的物品都会进入垃圾桶</gray>"
      - "<yellow>点击打开垃圾桶界面</yellow>"
    command: "trashbin"

  # 坐下休息说明（只读展示；实际交互为告示牌 + 右键方块）
  chair:
    enabled: true
    slot: 33
    material: OAK_SIGN
    name: "<gold>坐下休息</gold>"
    lore:
      - "<gray>在方块两侧放告示牌，写上 chair-l / chair-r</gray>"
      - "<gray>右键中间方块即可坐下</gray>"
    command: ""
