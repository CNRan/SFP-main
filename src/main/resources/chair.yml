# ==========================================================
# 椅子（chair 包）
# 文案在 messages.yml 的 chair.* 中修改
# ==========================================================

# 总开关：false 则完全停用椅子功能
enabled: true

# 告示牌关键字（第一行）
sign:
  left-keyword: "chair-l"
  right-keyword: "chair-r"
  # 关键字匹配是否区分大小写
  case-sensitive: false
  # 允许的木质告示牌材质前缀（对应 *_SIGN / *_WALL_SIGN / *_HANGING_SIGN 等）
  allowed-woods:
    - OAK
    - SPRUCE
    - BIRCH
    - JUNGLE
    - ACACIA
    - DARK_OAK
    - MANGROVE
    - CHERRY
    - BAMBOO
    - CRIMSON
    - WARPED

# 坐姿高度微调：玩家底部 = 方块顶部 - 该值（数值越大坐得越低）
seat-height-offset: 0.4

# 站起来的触发方式
stand-on:
  # 破坏椅子方块/告示牌时自动起身
  break: true
  # 传送离开时自动起身
  teleport: true
  # 再次右键同一座位时起身
  reclick: true
